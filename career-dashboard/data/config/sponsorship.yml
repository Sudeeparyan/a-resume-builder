# ============================================================
# THE SPONSORSHIP GATE
#
# One hard exclusion on the posting's own words, then ranking on evidence.
#
#   Posting explicitly WILL NOT sponsor          -> EXCLUDE, never shown
#   Posting says NOTHING about sponsorship       -> SHOW  (this is most postings)
#   Posting explicitly WILL sponsor              -> SHOW, rank top
#   Posting requires citizenship/clearance/ITAR  -> EXCLUDE (cannot be hired at all)
#
# Sponsorship HISTORY is a RANKING SIGNAL ONLY. A company with no H-1B
# record is still shown. Absence of evidence is not a refusal.
# ============================================================

meta:
  last_updated: "2026-09-18"
  candidate_status: "F-1 OPT, active. STEM-eligible. Needs H-1B eventually."

# ------------------------------------------------------------
# GROUP 1 — explicit refusal to sponsor. EXCLUDE.
# Case-insensitive regex, matched against the FULL job description text.
# ------------------------------------------------------------
exclude_no_sponsorship:
  - 'no\s+(visa\s+)?sponsorship'
  - 'will\s+not\s+(be\s+able\s+to\s+)?sponsor'
  - 'unable\s+to\s+(provide\s+|offer\s+|support\s+)?((US|visa|H-?1B|employment|work|immigration)\s+){0,3}sponsor'
  - 'do(es)?\s+not\s+(offer|provide|support)\s+.{0,25}sponsor'
  - 'cannot\s+(provide\s+|offer\s+|support\s+)?((US|visa|H-?1B|employment|work|immigration)\s+){0,3}sponsor'
  - 'will\s+not\s+(provide|offer|support)\s+((US|visa|H-?1B|employment|work|immigration)\s+){0,3}sponsor'
  - 'sponsorship\s+is\s+not\s+(available|offered|provided)'
  - 'not\s+able\s+to\s+sponsor'
  - 'without\s+(the\s+need\s+for\s+|requiring\s+)?(visa\s+|employer\s+|employment\s+)?sponsorship'
  # Retired 2026-10-02: 'now\s+or\s+in\s+the\s+future' on its own (it matched the application
  # question "Will you now or in the future require sponsorship?") and 'no\s+(C2C|corp\s*to\s*corp|
  # third[- ]party)' (contractor terms, not visas). The gate skips both even if re-added.
  - 'not\s+considering\s+candidates\s+.{0,30}sponsorship'
  - 'must\s+not\s+(now\s+or\s+in\s+the\s+future\s+)?require\s+((visa|employer|employment|work|immigration|H-?1B)\s+)?sponsorship'
  # Added 2026-10-02 (ported from the template edition's live-posting fixes).
  - 'without\s+(the\s+need\s+for\s+)?(current|present)\s*(or|and|/)\s*future\s+((visa|employer|employment|immigration|work|H-?1B)\s+){0,2}sponsorship'
  - '(must\s+not\s+require|excludes?)\s+(current|present)\s*(or|and|/)\s*future\s+((visa|employer|employment|immigration|work|H-?1B)\s+){0,2}sponsorship'
  - 'not\s+eligible\s+for\s+((visa|H-?1B|employment|work|immigration)\s+){0,2}sponsorship'
  - 'requir\w*\s+[^.;]{0,40}sponsorship[^.;]{0,60}\b(not\s+(be\s+)?(eligible|considered)|ineligible)'
  - 'sponsorship[^.;]{0,40}\b(is|are|will)\s+not\s+(be\s+)?(available|offered|provided|considered|possible|supported)'
  - 'not\s+(currently\s+)?(sponsoring|offering\s+(visa\s+)?sponsorship)'
  - 'do(es)?\s+not\s+(currently\s+)?sponsor\b'
  - 'ineligible\s+for\s+.{0,20}sponsorship'
  # Added 2026-09-18 after testing ten common US phrasings against the list above.
  - 'will\s+not\s+sponsor\s+(H-?1B|visas?|work\s+visas?|employment\s+visas?)'
  - 'no\s+visa\s+sponsorship\s+(is\s+)?(provided|available|offered)'
  - 'do(es)?\s+not\s+sponsor\s+(employment|work|immigration)?\s*visas?'
  - 'not\s+(able|eligible|in\s+a\s+position)\s+to\s+(obtain|provide|offer)\s+(visa\s+)?sponsorship'
  - 'sponsorship\s+(will\s+)?not\s+be\s+(provided|offered|available|considered)'
  - '(candidates|applicants|individuals)\s+(who\s+)?(requir(e|ing)|need(ing)?)\s+[^.;]{0,40}sponsorship[^.;]{0,50}\b(will\s+not|cannot|are\s+not)'
  # Added 2026-10-09 after testing thirty-six more US phrasings (thirteen slipped through).
  - 'not\s+open\s+to\s+(candidates|applicants|individuals|those)\s+[^.;]{0,40}sponsorship'
  - 'not\s+open\s+to\s+((visa|H-?1B|employment|work|immigration)\s+){0,2}sponsorship'
  - 'not\s+qualify\s+for\s+((visa|H-?1B|employment|work|immigration)\s+){0,2}sponsorship'
  - '(unable\s+to|cannot|can\s*not|will\s+not|do\s+not|not\s+able\s+to)\s+consider\s+(candidates|applicants|individuals|anyone)\s+[^.;]{0,50}sponsorship'
  - 'without\s+((visa|employer|employment|H-?1B|immigration|work)\s+){1,2}sponsorship'
  - 'sponsorship\s+not\s+(available|offered|provided|possible|supported)'
  - '\bsponsorship(\s+(available|offered|provided))?\s*:\s*(no|none|not\s+(available|offered|provided))\b'
  - 'sponsorship[^.;]{0,40}\b(need\s+not|should\s+not|do\s+not|please\s+do\s+not)\s+apply'
  # Annie is on F-1 OPT: a posting that turns away OPT, CPT, F-1 or H-1B holders turns her away.
  - '\b(OPT|CPT|F-?1|H-?1B)\b[^.;]{0,40}\b(will\s+not\s+be|are\s+not|is\s+not|cannot\s+be|not)\s+(considered|accepted|eligible)\b'
  - 'do(es)?\s+not\s+accept\s+[^.;]{0,40}\b(OPT|CPT|F-?1|H-?1B|visas?)\b'

# ------------------------------------------------------------
# GROUP 2 — cannot lawfully be hired regardless of interview outcome.
# A different reason from "won't sponsor", same action: EXCLUDE.
# ------------------------------------------------------------
exclude_cannot_hire:
  - 'U\.?S\.?\s+citizen(ship)?\s+(is\s+)?(required|mandatory)'
  - 'must\s+be\s+a\s+U\.?S\.?\s+citizen'
  - 'US\s+Citizens?\s+only'
  - 'security\s+clearance'
  - 'active\s+clearance'
  - 'TS\s*/\s*SCI'
  - 'top\s+secret'
  - '\bITAR\b'
  - '\bEAR\b\s+(compliance|controlled)'
  - 'export\s+control(led)?\s+.{0,30}(citizen|person)'
  - 'public\s+trust\s+clearance'
  - 'green\s+card\s+holder'
  - 'permanent\s+resident.{0,25}(required|only)'
  - 'U\.?S\.?\s+person\s+(status\s+)?(required|as\s+defined)'
  - 'U\.?S\.?\s+persons?\s+only'
  - 'must\s+be\s+(a\s+)?(United\s+States|U\.?S\.?A?\.?)\s+citizen'
  - '(United\s+States|U\.?S\.?A?\.?)\s+citizenship\s+(is\s+)?required'
  - 'citizenship\s+required\s+due\s+to'
  - '(secret|DoD|DOE|government)\s+clearance'
  # Added 2026-10-02 (ported from the template edition): verb-first wordings live postings use.
  - 'requires?\s+(active\s+)?(United\s+States|U\.?S\.?A?\.?)\s+citizenship'
  - 'only\s+(United\s+States|U\.?S\.?A?\.?)\s+citizens'
  - 'open\s+only\s+to\s+(United\s+States|U\.?S\.?A?\.?)\s+citizens'
  # Added 2026-10-02: a job title such as "Software Engineer - Reliability (US Citizen)".
  - '\((United\s+States|U\.?S\.?A?\.?)\s+citizens?(\s+only)?(\s+required)?\)'
  # Added 2026-10-09: hyphenated "export-controlled", "must be U.S. persons", and permanent
  # work authorization (which only citizens and green-card holders have).
  - 'export[-\s]+control(led)?\b[^.;]{0,80}\b(U\.?S\.?\s+(citizens?|persons?|nationals?)|citizenship|permanent\s+residen)'
  - 'must\s+be\s+(a\s+)?(United\s+States|U\.?S\.?A?\.?)\s+persons?'
  - '(must\s+(have|possess|hold)|requires?|required)\s+[^.;]{0,20}permanent\s+(U\.?S\.?\s+|United\s+States\s+)?(work|employment)\s+authori[sz]ation'
  - 'permanent\s+(U\.?S\.?\s+|United\s+States\s+)?(work|employment)\s+authori[sz]ation\s+(is\s+)?required'
  - 'authorized\s+to\s+work\s+[^.;]{0,40}\bon\s+a\s+permanent\s+basis'

# ------------------------------------------------------------
# POSITIVE — explicitly offers sponsorship. Ranks TOP (Tier A).
# ------------------------------------------------------------
positive_sponsorship:
  - 'visa\s+sponsorship\s+(is\s+)?(available|offered|provided)'
  - 'we\s+(will\s+)?sponsor'
  - 'willing\s+to\s+sponsor'
  - 'sponsorship\s+(is\s+)?available'
  - 'we\s+(do\s+)?sponsor\s+.{0,20}(H-?1B|visas?)'
  - 'open\s+to\s+candidates\s+requiring\s+sponsorship'
  - 'will\s+consider\s+.{0,30}sponsorship'
  - 'H-?1B\s+(transfer|sponsorship)\s+(available|welcome)'
  - 'cap[- ]exempt'

# ------------------------------------------------------------
# E-VERIFY — tracked separately, because it is not sponsorship.
#
# E-Verify enrollment is REQUIRED for the STEM OPT extension (+24 months),
# which is Annie's next step and needs no sponsorship at all. So an E-Verify
# employer is directly valuable even if it never files an H-1B.
#
# Reported as a flag. Does NOT by itself promote a role to tier A, because
# participating in E-Verify says nothing about willingness to sponsor.
# ------------------------------------------------------------
everify_signals:
  - 'participat(es|ing|e)\s+in\s+E-?Verify'
  - 'E-?Verify\s+(enrolled|employer|participant|program)'
  - 'enrolled\s+in\s+E-?Verify'
  - 'uses\s+E-?Verify'
  - '\bE-?Verify\b'

# ------------------------------------------------------------
# NEVER MATCH ON THESE — the biggest source of wrong exclusions.
#
# "Must be authorized to work in the United States" does NOT disqualify
# someone on active OPT. They ARE authorized. Only exclude when an
# explicit refusal from Group 1 also appears.
# ------------------------------------------------------------
do_not_exclude_on:
  - 'authorized\s+to\s+work'          # true of her today
  - 'work\s+authorization\s+required' # true of her today
  - 'eligible\s+to\s+work'            # true of her today
  - 'legally\s+authorized'            # true of her today
  - 'proof\s+of\s+eligibility'        # standard I-9 language
  - 'employment\s+eligibility\s+verification'  # I-9 / E-Verify, often a POSITIVE signal

# A sentence that NEGATES the requirement can never exclude, even though it
# contains a Group 1 / Group 2 phrase. "No security clearance required" and
# "this role does not require sponsorship" are good news, not refusals.
negation_guards:
  - '(does|do|will)\s+not\s+require\s+(a\s+|any\s+)?(security\s+|United\s+States\s+|U\.?S\.?A?\.?\s+)?(clearance|sponsorship|citizenship)'
  - 'no\s+(security\s+)?clearance\s+(is\s+)?(required|needed|necessary)'
  - '(clearance|citizenship)\s+(is\s+)?not\s+(required|needed|necessary)'
  - 'without\s+(the\s+need\s+for\s+)?(a\s+)?(security\s+)?clearance'
  # Absence claims: the posting (or a researcher's note) says none of the
  # restrictive language is present. The words "citizenship/clearance/ITAR"
  # appear only to say they are absent — never a requirement.
  - '\bno\s+[^.;]{0,100}(sponsorship|work[-\s]?authorization|citizenship|clearance|ITAR|EAR|permanent\s+residency)[^.;]{0,60}\b(language|mention|statement|wording|references?)\b'
  - '(contains?|includes?|mentions?|states?|lists?|makes?)\s+(no|not\s+any)\s+[^.;]{0,100}(sponsorship|work[-\s]?authorization|citizenship|clearance|ITAR|EAR)\s+(language|mention|statement|wording|references?)'
  - '\bno\s+(visa|work[-\s]?authorization|citizenship|clearance|sponsorship)[^.;]{0,40}\b(restrictions?|requirements?)\s+(stated|listed|mentioned|present)'
  - '(says|mentions|states)\s+nothing\s+about\s+[^.;]{0,60}(sponsorship|citizenship|clearance)'
  - '\bsilent\s+(on|about|regarding)\s+[^.;]{0,60}(sponsorship|citizenship|clearance)'
  # The application form's standard question, and notes that report it, ask; they do not refuse.
  - '\b(will|do|would)\s+you\s+[^.;]{0,80}sponsorship'
  - '\basks?\s+(about|whether|if|applicants)\s+[^.;]{0,80}sponsorship'
  - '(does|do)\s+not\s+(state|say|specify|indicate)\s+whether'

# Words that look relevant but are innocent — require a refusal verb nearby,
# never match the bare noun.
ambiguous_sponsor_noun:
  - 'event\s+sponsor'
  - 'executive\s+sponsor'
  - 'project\s+sponsor'
  - 'sponsor\s+a\s+(team|event|conference|meetup)'
  - 'sponsored\s+(content|post|research\s+grant)'
  # Export-control wording: "authorization to receive ... technology controlled under these
  # U.S. export laws without sponsorship for an export license" is about an export licence,
  # not a visa (it hid all 400 Cloudflare postings on 2026-10-02).
  - 'sponsorship\s+for\s+an?\s+export\s+licen[cs]e'

# ------------------------------------------------------------
# RANKING TIERS — all shown, best first.
# ------------------------------------------------------------
tiers:
  S:
    label: "Cap-exempt"
    meaning: "University, nonprofit research org, national lab, government research body, academic medical center. Files H-1B year-round with NO lottery."
    rank: 1
  A:
    label: "Says yes"
    meaning: "Posting explicitly offers sponsorship."
    rank: 2
  B:
    label: "Proven sponsor, silent posting"
    meaning: "H-1B petitions on record in USCIS/DOL data; posting does not mention sponsorship."
    rank: 3
  C:
    label: "Silent, no record"
    meaning: "No data either way. STILL SHOWN — this is the normal case and the largest bucket. Many of these sponsor once a candidate clears interviews."
    rank: 4
  EXCLUDED:
    label: "Excluded"
    meaning: "Matched Group 1 or Group 2. Never rendered. The triggering sentence is logged in SUMMARY.md so a wrong exclusion is visible."
    rank: 99

# ------------------------------------------------------------
# Cap-exempt detection — employer name / domain heuristics.
# ------------------------------------------------------------
cap_exempt_signals:
  domains: [".edu", ".gov"]
  name_contains:
    - "University"
    - "College"
    - "Institute of Technology"
    - "National Laboratory"
    - "National Lab"
    - "Research Institute"
    - "Medical Center"
    - "Health System"
    - "Children's Hospital"
    - "Cancer Center"
    - "Academy of Sciences"
    - "Foundation"
  known:
    - "Oak Ridge National Laboratory"
    - "Lawrence Livermore National Laboratory"
    - "Los Alamos National Laboratory"
    - "Argonne National Laboratory"
    - "Brookhaven National Laboratory"
    - "Pacific Northwest National Laboratory"
    - "Sandia National Laboratories"
    - "Fermilab"
    - "Broad Institute"
    - "Allen Institute"
    - "Mayo Clinic"
    - "Cleveland Clinic"
    - "Kaiser Permanente"
    - "MITRE"
    - "RAND Corporation"
    - "Howard Hughes Medical Institute"
    - "St. Jude Children's Research Hospital"

# ------------------------------------------------------------
# Data sources for the evidence layer (ranking only).
# ------------------------------------------------------------
data_sources:
  uscis_bulk:
    url_pattern: "https://www.uscis.gov/sites/default/files/document/data/h1b_datahubexport-{year}.csv"
    years: [2021, 2022, 2023]
    note: "FY2023 verified 2.2MB / HTTP 200. FY2024+ bulk exports are not published."
    cache: "system/data/sponsors-uscis.csv"
  dol_lca:
    url: "https://www.dol.gov/media/LCA_Disclosure_Data_FY2026_Q3.xlsx"
    size_bytes: 251850891
    note: "252MB. Opt-in deep refresh only — not part of the default scan."
    cache: "system/data/sponsors-lca.csv"
  everify:
    url: "https://www.e-verify.gov/about-e-verify/e-verify-data/how-to-find-participating-employers"
    note: "No bulk download exists. Search-only, updated daily. Checked per finalist. Needed for STEM OPT, never a gate."
  h1bgrader:
    url_pattern: "https://h1bgrader.com/h1b-sponsors/{slug}"
  myvisajobs:
    url: "https://www.myvisajobs.com/employers/search.aspx"

# ------------------------------------------------------------
# Honesty line — printed in every batch output.
# ------------------------------------------------------------
disclaimer: >-
  Sponsorship history is evidence that a company HAS sponsored, not a promise that it WILL.
  Absence of history is not a refusal — most employers say nothing about sponsorship, and many of
  those do sponsor once a candidate has cleared the interviews. The only hard exclusions are
  postings that explicitly refuse to sponsor, and postings that require citizenship, a security
  clearance, ITAR/EAR status, or permanent residency.
