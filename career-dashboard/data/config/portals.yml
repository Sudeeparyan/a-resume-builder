# ============================================================
# Where to look, and what to type. United States only.
#
# tracked_companies are checked DIRECTLY on their careers pages,
# ahead of any job board — fresher listings, fewer applicants.
# ============================================================

meta:
  last_updated: "2026-10-02"
  scan_cadence: "weekly"
  region: "united-states"

# ------------------------------------------------------------
# Tracked companies. `ats` lets the hunter hit the public JSON API
# directly instead of scraping. `cap_exempt: true` ranks first —
# those file H-1B year-round with no lottery.
#
# Add companies from context/07-preferences.md Q8 as they're named.
# ------------------------------------------------------------
