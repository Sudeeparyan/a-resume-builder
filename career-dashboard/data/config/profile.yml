sponsorship:
  rule:
    explicit_refusal: EXCLUDE - never shown in any list; logged with the triggering sentence
    silent: SHOW - most postings; where most offers come from
    explicit_offer: SHOW and rank top
    citizenship_clearance_itar: EXCLUDE - cannot lawfully be hired regardless of interview outcome
    authorized_to_work_required: SHOW - she is authorized (F-1 OPT)
    no_h1b_history: SHOW - history is a ranking signal only
  tiers:
    S: Cap-exempt employer (no lottery, files year-round)
    A: Posting says it sponsors
    B: Proven H-1B sponsor, silent posting
    C: Silent posting, no record (the normal case)
  config: data/config/sponsorship.yml
  index: data/sponsors/sponsors-uscis.csv
reapply:
  ghost_after_days: 21
  reject_cooldown_days: 180
  ghost_cooldown_days: 90
  rule: Same company and role is never surfaced again at any status. A rejection hides the company
    for 180 days. An application silent for 21 days becomes ghosted; the company is eligible again
    after 90 days for a different role only.
competition_strategy:
  prefer:
  - Cap-exempt employers (universities, national labs, nonprofit research institutes, academic medical centers)
  - Postings that explicitly offer sponsorship
  - Companies under 200 employees
  - Postings less than 7 days old
  - Medical-device and health-tech employers (Soliton/Dräger history plus ventilator-telemetry project)
  - Embedded / test-automation roles (least contested track)
  - Roles needing an uncommon skill combination she has (Flink event-time semantics, LabVIEW+Python V&V, FPGA plus data)
  avoid:
  - Roles demanding more than 4 years
  - Postings older than 30 days with no re-post
  - Senior/Staff/Principal/Lead titles
  - Staffing-agency reposts of the same role
project_selection:
  registry: data/context/evidence.yml
  allow_only_resume_ready_projects: true
  signature_first: true
  signature_rule: Exactly one signature project per company, first in Projects, never repeated
    across companies. Supporting projects may repeat. Registry table data/signature-projects.md.
  current_problem_sources:
  - Verified job-description snapshot
  - Target employer official website
  - Target employer official newsroom or filing
  - Target employer engineering or product documentation
  ranking_weights:
    problem_similarity: 35
    required_skill_evidence: 30
    evidence_strength: 20
    domain_and_stakeholder_similarity: 10
    recency: 5
  safeguards:
  - Company research ranks real projects; it never creates candidate experience.
  - Keep the original project identity, evidence type, ownership, and completion status.
  - Do not imply the project was built for the target employer.
  - If no project is a strong analogue, disclose the gap, ship the strongest real project, and write a build-now spec into study-plan.md.
  required_selected_projects: 2
ten_company_request:
  trigger_examples:
  - give me 10 companies
  - find 10 matching companies
  - make 10 tailored resumes
  - /hunt
  default_scope: End-to-end discovery, sponsorship gate, tracker check, verification, ranking,
    tailoring, compilation, visual QA, study plan, and delivery; not list-only.
  target_release_count: 10
  batch_mix:
    A: 4
    B: 2
    C: 2
    D: 2
  discovery_rule: Continue replacing excluded, rejected, duplicate, expired, or inaccessible leads
    until ten distinct eligible live JDs are secured or the honest market search is exhausted.
  deliverables:
  - Ranked table of company, role, location, posting URL, sponsorship tier, fit decision, supported requirement coverage, and key gap
  - Ten isolated one-page tailored resume artifact folders named Annie_Manoharan_<Company>_<NN>
  - Direct paths to every released resume PDF and job folder
  application_rule: Never submit an application or send outreach without explicit authorization. This workspace prepares; Annie submits.
resume_contract:
  template: data/templates/resume-base.tex
  paper: letter
  layout: single_column
  required_pages: 1
  minimum_body_font_pt: 10
  maximum_body_font_pt: 11
  fit_rule: Fit by cutting content in the documented order, never by shrinking margins or fonts below 10pt.
  cut_order:
  - Third bullet of the supporting project
  - Last bullet of the oldest role (repeats up the list)
  - Coursework line
  - Second degree
  required_sections:
  - Education
  - Technical Skills
  - Professional Experience
  - Projects
  section_order_by_track:
    A: [Education, Technical Skills, Professional Experience, Projects]
    B: [Education, Technical Skills, Projects, Professional Experience]
    C: [Education, Technical Skills, Professional Experience, Projects]
    D: [Education, Technical Skills, Projects, Professional Experience]
  header_fields:
  - full_name
  - phone
  - email
  - portfolio_url
  - github
  omitted_by_default:
  - Summary or objective section
  - City
  - LinkedIn
  - Work authorization line
  - GPA
  prohibited_filler:
  - References available upon request
  - Generic objective statements
  - Unsupported extracurriculars
  - passionate about
  - results-oriented
  - proven track record
  - leveraged
  - spearheaded
  - synergies
  - robust
  - seamless
  - cutting-edge
  - dynamic professional
  - Responsible for
  - Worked on
  - Helped with
  - Involved in
  - Tasked with
  - significantly
  - greatly
  - substantially
  - highly
  diagnostics:
    job_fit_score: Opportunity decision only
    supported_requirement_coverage: Required/preferred JD requirements backed by evidence IDs
    artifact_qa: Binary hard gates; never averaged into a score
  release_command: python3 backend/scripts/validate_resume.py <resume.tex> --compile --output
    <resume.pdf> --render-dir <resume-preview> --qa-json <qa.json>
  required_selected_projects: 2
batch_contract:
  maximum_jobs: 10
  isolated_job_folders: true
  folder_name_pattern: Annie_Manoharan_<CompanyNoSpaces>_<NN>
  retry_limit: 3
  required_artifacts:
  - job-description.md
  - evaluation.md
  - company-research.md
  - study-plan.md
  - evidence-map.yml
  - resume.tex
  - resume.pdf
  - resume-preview/page-01.png
  - qa.json
  cross_batch_invariants:
