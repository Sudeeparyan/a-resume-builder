narrative:
  headline: Data and AI engineer with production AWS pipeline work, a sub-second streaming
    platform, measured computer-vision research, and shipped medical-device test automation
  career_story: Moved from electronics and embedded systems, through professional software test
    automation at Soliton Technologies (Dräger medical-device applications), into computer-vision
    research at the University of Arkansas AICV Lab and production data engineering at InsOps Inc.
    The range runs from FPGA firmware to RAG pipelines, with shipped work at every layer.
  proof_points:
  - Sub-second Kafka/Flink SQL/ClickHouse streaming platform with event-time OVER windows and watermark strategies (PROJ-P01-IOT)
  - MiGa keypoint mAP 91.83% at 1,250 FPS, 0.93 MOTA, 0.91 IDF1 (PROJ-P02-MIGA)
  - DualFit on VITON-HD at 24.9 PSNR, 0.913 SSIM, 5.261 FID (PROJ-P03-DUALFIT)
  - Resume classifier at 89.48% test accuracy and 88% macro F1 across 25 categories (PROJ-P05-RESUME)
  - Sole developer of the Dräger WPF application; approximately 94% of manual test cases automated (EXP-SOLITON-PE-001, METRIC-DRAEGER-94)
  - Already inside a cap-exempt employer as TA and RA at the University of Arkansas
