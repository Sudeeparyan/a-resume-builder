schema_version: 1
candidate_revision: 2026-09-23.1
candidate: Annie Prasanna Manoharan
status_definitions:
  confirmed: Transcribed from one of Annie's 14 real resumes in data/context/files/ and approved for normal use.
  user_reported: Supplied or confirmed by Annie in conversation; preserve attribution and wording.
  conditional: Usable only under the condition stated in approved_external_use.
  hold: Do not use in candidate-facing material until Annie confirms it.
  missing: Required detail has not been supplied. Never state it.
defaults:
  naming_rule: Client names (Medtronic, Dräger) appear on Annie's own resumes and may be printed.
  ownership_rule: Preserve her hedges exactly ("Contributed to", "Supported", "Assisted"). Never upgrade a hedge to ownership.
  years_rule: Never state a total years-of-experience figure. EXP-TOTAL-YEARS is missing by design.
  publication_rule: No publication may be named, implied or hinted at until PUB-001 leaves hold.
  research_rule: MiGa and DualFit are AICV Lab research. Present them as research, never as personal side projects.
  intern_rule: An intern title stays an intern title.
  concurrency_rule: InsOps, the TA post and the RA post overlap (2024-2026). Never present them as sequential and never sum their durations.
  source_rule: Each entry points to the context file and section that supports it; evidence.yml is the external-wording authority.
  selection_metadata_rule: problem_patterns and role_tracks are ranking metadata, not candidate claims; never print them.
