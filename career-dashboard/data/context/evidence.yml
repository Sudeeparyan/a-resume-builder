projects:
- id: PROJ-P01-IOT
  canonical_name: Real-Time Medical IoT Analytics Platform
  external_name: Real-Time Medical IoT Analytics Platform
  date_context: Graduate project, 2024-2026; exact dates not supplied
  source_refs:
  - data/context/04-projects.md > P1
  evidence_type: candidate_project
  status: confirmed
  ownership: Individual project
  approved_external_use: always; strongest general-purpose signature project
  problem_patterns:
  - streaming
  - real-time analytics
  - event-time processing
  - anomaly detection
  - OLAP schema design
  - medical devices
  - dashboards
  role_tracks:
  - Data Engineer
  - Analytics Engineer
  - Data Platform Engineer
  - Software Engineer
  - ML Engineer
  technologies:
  - Apache Kafka
  - Apache Flink
  - Flink SQL
  - Python
  - ClickHouse
  - Grafana
  approved_facts:
  - Developed an end-to-end, sub-second latency streaming platform using Apache Flink SQL and Apache Kafka to ingest, process, and score high-frequency medical IoT device data
  - Implemented temporal Flink OVER windows partitioned by device ID to dynamically compute rolling Z-scores over 5-second sliding intervals, applying custom watermark delay strategies to cleanly handle out-of-order data streams
  - Designed high-performance ClickHouse schemas using the MergeTree engine sorted by composite keys to physically align disk layouts with clinical querying patterns, isolating ingestion via an optimized Python multi-topic batch consumer
  - Integrated a Grafana visualization layer on the ClickHouse OLAP tier, delivering real-time clinical dashboards monitoring raw ventilator telemetry and surfacing streaming Z-score anomalies
  resume_content:
    title: Real-Time Medical IoT Analytics Platform
    context: Apache Kafka, Apache Flink, Flink SQL, Python, ClickHouse, Grafana
    bullets:
    - Developed an end-to-end, sub-second latency streaming platform using Apache Flink SQL and Apache Kafka to ingest, process, and score high-frequency medical IoT device data
    - Implemented temporal Flink OVER windows partitioned by device ID to compute rolling Z-scores over 5-second sliding intervals, applying custom watermark delay strategies to handle out-of-order streams
    - Designed ClickHouse MergeTree schemas sorted by composite keys to align disk layout with clinical query patterns, with an optimized Python multi-topic batch consumer isolating ingestion
  prohibited:
  - Production deployment or hospital use
  - Team size or users
- id: PROJ-P02-MIGA
  canonical_name: MiGa - Multi-Chicken Gait Assessment
  external_name: MiGa - Multi-Chicken Gait Assessment (AICV Lab research)
  date_context: Research Assistant work, Sep 2024 - Jan 2026
  source_refs:
  - data/context/04-projects.md > P2
  - data/context/03-experience.md > Research Assistant > Project MiGa
  evidence_type: academic
  status: confirmed
  ownership: Research Assistant contribution within the AICV Lab
  approved_external_use: always, presented as lab research
  problem_patterns:
  - computer vision
  - pose estimation
  - multi-object tracking
  - sequence classification
  - dataset construction
  - research
  role_tracks:
  - ML Engineer
  - Computer Vision Engineer
  - Applied Scientist
  - Research Engineer
  - Data Engineer
  technologies:
  - YOLO11n-Pose
  - OC-SORT
  - LSTM
  - PyTorch
  approved_facts:
  - Integrated YOLO11n-Pose for keypoint estimation, applied OC-SORT for multi-object tracking (MOT), and constructed a many-to-one LSTM sequence network for classification
  - Built a data engineering framework to preprocess and segment raw frames into a Multi-Bird Detection split of 4,569 frames with 11,422 bounding boxes and a Gait-Score Regression split spanning 55 expert-annotated sequences
  - Implemented spatial normalization to map keypoints into local coordinate spaces to eliminate translational variance, achieving keypoint mAP 91.83% at 1,250 FPS, 0.93 MOTA, 0.91 IDF1
