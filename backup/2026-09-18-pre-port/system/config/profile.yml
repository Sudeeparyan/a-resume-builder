# ------------------------------------------------------------
# Which openings to chase first. Tuned for callback probability,
# not prestige.
# ------------------------------------------------------------
competition_strategy:
  prefer:
    - "CAP-EXEMPT employers first — universities, national labs, nonprofit research orgs, academic medical centers. They file H-1B year-round with NO lottery. FY2026 ran ~339k registrations for 85k slots (~25%). She is already inside a university system."
    - "Postings that explicitly offer sponsorship — rare, and the highest-converting query in portals.yml"
    - "Companies under 200 employees — fewer applicants per opening"
    - "Postings less than 7 days old — apply before the pile builds"
    - "Medical-device and health-tech employers — the Soliton/Medtronic history plus the ventilator-telemetry project is a genuine domain thread most applicants lack"
    - "Embedded / test-automation roles — the least contested of her four tracks and the one her profile fits best"
    - "Roles needing an uncommon skill combination she actually has (Flink event-time semantics, LabVIEW+Python V&V, FPGA+data)"
  avoid:
    - "Roles demanding more years than her real timeline — Q1 is unresolved, so cap at 4 years required"
    - "Postings older than 30 days with no re-post"
    - "Senior/Staff/Principal/Lead titles"
  exclude_hard:
    # These are the ONLY sponsorship-related exclusions. See system/config/sponsorship.yml.
    - "Postings that EXPLICITLY refuse to sponsor"
    - "Postings requiring US citizenship, a security clearance, ITAR/EAR status, or permanent residency"
  never_exclude_on:
    - "Absence of H-1B history — most employers never appear in that data, and many sponsor after the interviews"
    - "'Must be authorized to work in the US' — she IS authorized, on active OPT"

exclusions:
  # Companies already applied to — the job-hunter must never resurface these.
  applied_companies_file: "system/data/applied-companies.md"
